# ── faster-whisper-server Deployment ─────────────────────────────────────────
# Speech-to-text service for the media embedding pipeline.
# Exposes an OpenAI-compatible POST /v1/audio/transcriptions endpoint with
# response_format=verbose_json for per-segment timing data.
#
# Image: fedirz/faster-whisper-server (MIT). Models: the Systran faster-whisper CTranslate2 conversions
# (MIT), which are conversions of OpenAI Whisper (Apache 2.0). See NOTICE.
# Default model: base — adequate for most speech; upgrade to medium/large-v3
# for noisy recordings or non-English audio.
#
# RESOURCE NOTE: Whisper is CPU-bound unless a GPU is available.
# Increase memory limits when switching to medium or large models.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper
  namespace: ythril
  labels:
    app: whisper
    component: media-embedding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisper
  template:
    metadata:
      labels:
        app: whisper
        component: media-embedding
    spec:
      # NOTE — this image can run neither as a non-root user nor on a read-only root filesystem, and
      # both were verified against `fedirz/faster-whisper-server:latest-cpu` rather than assumed:
      # the server is launched through `uv run`, which rewrites its own virtualenv under the
      # root-owned /root/faster-whisper-server on every start. As uid 1000 that write is denied; with
      # a read-only rootfs it crash-loops on "Read-only file system (os error 30)". Everything that
      # does NOT depend on the image's layout — dropped capabilities, no privilege escalation,
      # seccomp, the resource ceilings, and the media NetworkPolicy — still applies, and this matches
      # what `docker-compose.yml` does for the same image.
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whisper
          image: fedirz/faster-whisper-server:latest-cpu
          ports:
            - containerPort: 8000
              name: http
          env:
            # No WHISPER_MODEL here: Ythril sends the model with every request
            # (`mediaEmbedding.stt.model`, default `base`) and faster-whisper-server downloads it on
            # first use. The image's own default-model knob is WHISPER__MODEL (double underscore,
            # pydantic nested settings) — the single-underscore spelling never set anything.
            - name: HF_HOME
              value: /tmp/huggingface
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
          volumeMounts:
            - name: cache
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            # readOnlyRootFilesystem intentionally omitted — see the pod-level note above.
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: whisper
  namespace: ythril
  labels:
    app: whisper
    component: media-embedding
spec:
  selector:
    app: whisper
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
